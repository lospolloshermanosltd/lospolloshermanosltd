<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOS POLLOS HERMANOS LTD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ranchers&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:#050505;
      --fg:#d9e3e1;
      --fg-dim:rgba(230,230,230,0.5);
      --line:#1F4E79;
      --accent:#F3D80D;
      --accent-glow:rgba(243,216,13,0.3);

      --flow-duration:1.8s;
      --packet-duration:2.4s;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:'IBM Plex Mono', monospace;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .page{
      width:100%;
      max-width:1000px;
      text-align:center;
    }

    .brand-title{
      font-family:'Ranchers';
      font-size:70px;
      color:var(--accent);
      text-shadow:0 0 15px var(--accent-glow);
      margin:0;
    }

    .routing-title{
      margin:20px 0;
      letter-spacing:0.15em;
      color:var(--accent);
    }

    .secure-channel{
      position:relative;
      margin-top:40px;
      padding-top:25px;
      overflow:hidden;
    }

    /* dashed line */
    .secure-channel::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:1px;
      background:linear-gradient(90deg,var(--line)50%,transparent 50%);
      background-size:15px 1px;
      animation:routing-flow var(--flow-duration) linear infinite;
    }

    @keyframes routing-flow{
      from{background-position:0 0;}
      to{background-position:15px 0;}
    }

    /* packets */
    .packet{
      position:absolute;
      top:-2px;
      width:4px;
      height:4px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 10px var(--accent-glow);
      animation:packet var(--packet-duration) linear infinite;
      opacity:0;
    }

    .packet.p2{
      animation-delay:1.2s;
    }

    @keyframes packet{
      0%{left:-20px;opacity:0;}
      10%{opacity:1;}
      90%{opacity:1;}
      100%{left:100%;opacity:0;}
    }

    .pubkey{
      margin-top:15px;
      font-size:12px;
      color:var(--fg-dim);
    }

    .status{
      margin-top:10px;
      font-size:11px;
      color:var(--accent);
      letter-spacing:0.1em;
    }
  </style>
</head>

<body>
<div class="page">

  <h1 class="brand-title">LOS POLLOS HERMANOS</h1>
  <div class="routing-title">ROUTING MENU</div>

  <div class="secure-channel">
    <div class="packet p1"></div>
    <div class="packet p2"></div>

    <!-- pubkey 그대로 -->
    <div class="pubkey" id="pubkey">
      033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28
    </div>

    <!-- 핵심: 실제 상태 -->
    <div class="status" id="status">
      LOADING...
    </div>
  </div>

</div>

<script>
const PUBKEY = "033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28";

async function loadNode(){
  try{
    const res = await fetch(`https://mempool.space/api/v1/lightning/nodes/${PUBKEY}`);
    const data = await res.json();

    const channels = data.active_channel_count;
    const capacity = (data.capacity/100000000).toFixed(2);

    const now = Date.now();
    const updated = Math.floor((now - data.last_update*1000)/1000);

    document.getElementById("status").textContent =
      `LIVE: ${channels} CHANNELS / ${capacity} BTC / UPDATED ${updated}s AGO`;

  }catch(e){
    document.getElementById("status").textContent = "OFFLINE";
  }
}

loadNode();
setInterval(loadNode,10000);

/* subtle randomness */
setInterval(()=>{
  const root = document.documentElement;

  const flow = (1.8*(0.88+Math.random()*0.24)).toFixed(2);
  const packet = (2.4*(0.88+Math.random()*0.24)).toFixed(2);

  root.style.setProperty('--flow-duration', flow+'s');
  root.style.setProperty('--packet-duration', packet+'s');

},2400);
</script>

</body>
</html>
