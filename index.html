<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS POLLOS HERMANOS LTD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Ranchers&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'JI Burrito';
      src: url('JI Burrito.ttf') format('truetype'); 
      font-display: swap;
    }

    :root {
      --bg: #050505;
      --fg: #d9e3e1;
      --fg-soft: #E6E6E6; 
      --fg-dim: rgba(230, 230, 230, 0.5); 
      --line: #1F4E79;        
      --accent: #F3D80D;      
      --brand-red: #DA291C;   
      --accent-glow: rgba(243, 216, 13, 0.3);
      --line-glow: rgba(31, 78, 121, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'IBM Plex Mono', monospace;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden; 
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center; 
      height: 100vh; 
      padding-top: 5vh;
      padding-bottom: 2vh; 
    }

    .page {
      width: 100%;
      max-width: 1100px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px; 
    }

    .brand-title {
      font-family: 'JI Burrito', 'Ranchers', sans-serif;
      font-size: 80px;
      color: var(--accent);
      margin: 0;
      line-height: 1.0;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.8), 0 0 15px var(--accent-glow);
      font-weight: 400;
      letter-spacing: -1px;
    }

    .brand .sub {
      margin-top: 6px;
      color: var(--fg-dim);
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .routing-title {
      color: var(--accent);
      font-size: 19px; 
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 20px; 
      text-shadow: 0 0 5px var(--accent-glow);
    }

    .blink { animation: blinker 1s step-end infinite; }
    @keyframes blinker { 50% { opacity: 0; } }

    .menu-container {
      display: grid;
      grid-template-columns: 1fr 1fr; 
      column-gap: 80px; 
      width: 100%;
    }

    .menu-track {
      border: 3px solid var(--line); 
      background: #0a0a0a;
      padding: 30px; 
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      border-radius: 2px;
    }

    .section {
      margin-bottom: 40px; 
    }
    .section:last-child { margin-bottom: 0; }

    .section-title {
      color: #fff;
      font-size: 14px; 
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px; 
      padding-bottom: 5px;
      border-bottom: 1px dotted var(--line); 
      display: flex;
      justify-content: space-between;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 8px; 
      font-size: 14px; 
    }

    .row .label { text-transform: uppercase; white-space: nowrap; padding-right: 8px; color: var(--fg-soft); }
    .row .fill { flex-grow: 1; border-bottom: 1px dotted rgba(31, 78, 121, 0.3); position: relative; top: -4px; }
    .row .value { color: var(--accent); font-weight: 700; padding-left: 10px; text-shadow: 0 0 4px var(--accent-glow); white-space: nowrap; }

    .value.highlight { background: var(--accent); color: #000; padding: 0 6px; text-shadow: none; }

    .value a {
      color: var(--accent);
      text-decoration: none;
    }

    .value a:hover {
      text-decoration: underline;
    }

    .secure-channel-container {
      grid-column: 1 / -1; 
      margin-top: 30px; 
      text-align: center;
    }

    .secure-channel {
      border-top: 1px dashed var(--line);
      padding-top: 15px;
      width: 100%;
    }

    .pubkey-label {
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 8px;
      letter-spacing: 0.15em;
    }

    .pubkey {
      font-size: 12px;
      color: var(--fg-dim);
      background: rgba(0,0,0,0.5);
      padding: 8px 15px;
      border: 1px solid var(--line);
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
    }

    .footer {
      margin-top: 30px; 
      display: flex;
      justify-content: center;
      gap: 20px; 
    }

    .footer a {
      background-color: var(--brand-red);
      color: #fff;
      text-decoration: none;
      padding: 12px 40px; 
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.15em;
      border: 1px solid var(--brand-red);
      box-shadow: 0 0 15px rgba(218, 41, 28, 0.3);
      text-transform: uppercase;
    }

    @media (max-width: 950px) {
      body { height: auto; overflow-y: auto; padding: 20px 15px; }
      .menu-container { grid-template-columns: 1fr; row-gap: 30px; }
      .brand-title { font-size: 50px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <h1 class="brand-title">LOS POLLOS HERMANOS LTD</h1>
      <div class="sub">IF THE ROUTE MATTERS, THE KITCHEN IS OPEN.</div>
    </div>

    <div class="routing-title">ROUTING MENU<span class="blink">_</span></div>

    <div class="menu-container">
      <div class="menu-track">
        <!-- 생략: 기존 그대로 -->
      </div>

      <div class="menu-track">
        <div class="section">
          <div class="section-title"><span>[ CONTACT / INFO ]</span><span>COMMS</span></div>

          <div class="row">
            <span class="label">EMAIL</span>
            <span class="fill"></span>
            <span class="value">lospolloshermanosltd@proton.me</span>
          </div>

          <div class="row">
            <span class="label">NOSTR</span>
            <span class="fill"></span>
            <span class="value">PENDING</span>
          </div>

          <div class="row">
            <span class="label">LNURL</span>
            <span class="fill"></span>
            <span class="value">order@oksu.su</span>
          </div>

          <div class="row">
            <span class="label">TELEGRAM</span>
            <span class="fill"></span>
            <span class="value">
              <a href="https://t.me/lospolloshermanosltd" target="_blank">
                @lospolloshermanosltd
              </a>
            </span>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
