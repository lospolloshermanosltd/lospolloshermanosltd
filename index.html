<style>
    :root {
      --bg: #050505;
      --fg: #d9e3e1;
      --fg-soft: rgba(217, 227, 225, 0.82);
      --fg-dim: rgba(217, 227, 225, 0.48);
      
      /* [100점 밸런스 컬러 시스템] */
      --line: #1F4E79;        /* Blue: 중채도/중저명도 베이스 */
      --accent: #F3D80D;      /* Yellow: 시선 집중 하이라이트 */
      --brand-red: #DA291C;   /* Red: 묵직한 액션/브랜드 포인트 */
      
      --accent-glow: rgba(243, 216, 13, 0.3);
      --line-glow: rgba(31, 78, 121, 0.4);
    }

    /* 터미널 본체: 선명해진 블루 테두리 */
    .terminal {
      border: 1.5px solid var(--line); /* 1px은 너무 가늘고 2px은 투박함, 1.5px이 섹시함 */
      background: #0a0a0a;
      padding: 30px 35px 25px; 
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(31, 78, 121, 0.05);
    }

    /* POS 헤더: 컨테이너(블루)와 일체화된 완벽한 대칭 */
    .terminal-head {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 20px;
      background: var(--bg);
      border: 1.5px solid var(--line); /* 본체 테두리와 동일 굵기/색상 */
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      box-shadow: 0 0 15px var(--line-glow); /* 블루 베이스의 은은한 광원 */
      text-shadow: 0 0 5px var(--accent-glow);
    }

    /* 내부 구분선: 영수증 감성을 위한 점선 최적화 */
    .section-title {
      border-bottom: 1px dotted var(--line); /* 파란색 점선으로 디테일 통일 */
      color: #fff;
      font-size: 13px;
      margin-bottom: 15px;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .row .fill {
      border-bottom: 1px dotted rgba(31, 78, 121, 0.3); /* 채널 채우기도 블루톤 점선 */
    }

    /* 하단 버튼: 묵직한 레드로 무게감 확보 */
    .footer a {
      background-color: var(--brand-red);
      color: #fff;
      border: 1px solid var(--brand-red);
      padding: 14px 45px; /* 약간 더 키워서 안정감 부여 */
      font-weight: 900;
      box-shadow: 0 0 20px rgba(218, 41, 28, 0.25);
    }
</style>
