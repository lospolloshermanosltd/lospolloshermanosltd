<script>
    const PUBKEY = '033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28';

    function formatSats(value) {
      return Math.round(Number(value || 0)).toLocaleString('en-US') + ' SATS';
    }

    function shortKey(key) {
      return key.slice(0, 8) + '...' + key.slice(-4);
    }

    function setTickerText(text) {
      document.getElementById('tickerText').textContent = text;
    }

    function rotateTicker(lines, interval = 3200) {
      if (!Array.isArray(lines) || !lines.length) return;
      let i = 0;
      setTickerText(lines[0]);
      if (lines.length === 1) return;
      setInterval(() => {
        i = (i + 1) % lines.length;
        setTickerText(lines[i]);
      }, interval);
    }

    async function loadNode() {
      try {
        // 캐시 방지를 위해 현재 시간을 쿼리 스트링으로 추가합니다.
        const res = await fetch(`https://mempool.space/api/v1/lightning/nodes/${PUBKEY}?t=${Date.now()}`, {
            headers: { 'Cache-Control': 'no-cache' }
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // 3.44 BTC 케파와 44채널을 정확히 반영하기 위해 
        // 'active_channel_count'가 아닌 전체 'channel_count'를 우선 체크합니다.
        const capacity = data.capacity || 0;
        const channelCount = data.channel_count || data.active_channel_count || 0;

        document.getElementById('capacityValue').textContent =
          `${(Number(capacity) / 100_000_000).toFixed(2)} BTC`;

        document.getElementById('channelsValue').textContent =
          Number(channelCount).toLocaleString();

        console.log("Node Data Updated:", data); // 디버깅용
        return data;
      } catch (e) {
        console.error("Fetch Error:", e);
        document.getElementById('capacityValue').textContent = 'RETRYING...';
        document.getElementById('channelsValue').textContent = 'RETRYING...';
        return null;
      }
    }

    async function loadPeerTicker() {
      try {
        // 채널 리스트도 최신 데이터를 위해 타임스탬프 추가
        const url = `https://mempool.space/api/v1/lightning/channels?public_key=${PUBKEY}&status=open&t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.channels || []);

        if (!list.length) {
            setTickerText('NO ACTIVE PEERS DETECTED');
            return;
        }

        const lines = list.map(ch => {
          const peerKey = ch.node1_public_key === PUBKEY
            ? ch.node2_public_key
            : ch.node1_public_key;
          return `PEER ${shortKey(peerKey)} / ${formatSats(ch.capacity)}`;
        });

        rotateTicker(lines, 3200);
      } catch (e) {
        let dots = 1;
        setTickerText('LINK WAITING.');
        setInterval(() => {
          dots = dots === 3 ? 1 : dots + 1;
          setTickerText(`LINK WAITING${'.'.repeat(dots)}`);
        }, 700);
      }
    }

    function randomizeFlow() {
      const root = document.documentElement;
      const flow = (1.8 * (0.92 + Math.random() * 0.16)).toFixed(2);
      const packet = (2.4 * (0.92 + Math.random() * 0.16)).toFixed(2);
      root.style.setProperty('--flow-duration', `${flow}s`);
      root.style.setProperty('--packet-duration', `${packet}s`);
    }

    function copyEmail(e, addr) {
      e.preventDefault();
      navigator.clipboard.writeText(addr).then(() => {
        const t = e.target;
        const orig = t.innerText;
        t.innerText = '[ COPIED! ]';
        t.style.color = '#fff';
        setTimeout(() => {
          t.innerText = orig;
          t.style.color = 'var(--accent)';
        }, 1500);
      });
    }

    function bindPubkeyCopy() {
      const el = document.getElementById('pubkeyValue');
      const original = el.textContent;
      el.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(PUBKEY);
          el.textContent = '[ PUBKEY COPIED ]';
          el.style.color = 'var(--accent)';
          setTimeout(() => {
            el.textContent = original;
            el.style.color = '';
          }, 1400);
        } catch (e) {
          el.textContent = '[ COPY FAILED ]';
          setTimeout(() => {
            el.textContent = original;
          }, 1400);
        }
      });
    }

    async function init() {
      randomizeFlow();
      setInterval(randomizeFlow, 2400);
      bindPubkeyCopy();

      // 최초 실행
      await loadNode();
      await loadPeerTicker();
      
      // 5분마다 자동으로 데이터 갱신 (선택 사항)
      setInterval(async () => {
          await loadNode();
      }, 300000);
    }

    init();
</script>
