<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOS POLLOS HERMANOS LTD</title>

<style>
:root {
  --bg: #000;
  --fg: #d9e3e1;
  --fg-dim: rgba(217,227,225,0.5);
  --line: rgba(217,227,225,0.1);
  --accent: #f3d80d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-monospace, monospace;
  display: flex;
  justify-content: center;
}

.page {
  width: min(100%, 1000px);
  padding: 20px;
}

/* =========================
   CLI HEADER (핵심)
========================= */
.cli {
  border: 1px solid var(--line);
  padding: 14px 18px;
  margin-bottom: 20px;
  font-size: 13px;
  letter-spacing: 0.12em;
  background: rgba(255,255,255,0.02);
}

.prompt { color: #5cff5c; }
.path { color: #5ccfff; }

.cmd {
  color: var(--fg);
}

.alias {
  color: var(--accent);
  font-weight: 700;
}

/* blinking cursor */
.cursor::after {
  content: "█";
  margin-left: 4px;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* ========================= */

.section {
  margin-bottom: 28px;
}

.title {
  font-size: 12px;
  letter-spacing: 0.15em;
  color: #fff;
  margin-bottom: 10px;
}

.row {
  display: grid;
  grid-template-columns: max-content 1fr 120px;
  gap: 8px;
  font-size: 13px;
  margin-bottom: 6px;
}

.label::before {
  content: "> ";
  color: var(--accent);
}

.fill {
  border-bottom: 1px dotted var(--line);
}

.value {
  text-align: right;
  color: var(--accent);
}

/* pubkey */
.pubkey {
  font-size: 12px;
  word-break: break-all;
  cursor: pointer;
  margin-top: 10px;
}

.pubkey:hover {
  color: #fff;
}

.footer {
  margin-top: 20px;
  text-align: center;
  font-size: 11px;
}

.footer a {
  color: var(--fg);
  text-decoration: none;
  margin: 0 10px;
}

.footer a:hover {
  color: var(--accent);
}
</style>
</head>

<body>
<div class="page">

  <!-- 🔥 CLI HEADER -->
  <div class="cli">
    <span class="prompt">root@node</span>:<span class="path">~</span>$ 
    <span class="cmd">alias</span> 
    <span class="alias">lph="LOS_POLLOS_HERMANOS_LTD"</span>
    <span class="cursor"></span>
  </div>

  <!-- NODE STATS -->
  <div class="section">
    <div class="title">[ NODE STATS ]</div>
    <div class="row"><span class="label">TOTAL INVENTORY</span><span class="fill"></span><span class="value" id="capacity">-- BTC</span></div>
    <div class="row"><span class="label">CHANNELS</span><span class="fill"></span><span class="value" id="channels">--</span></div>
  </div>

  <!-- NODE SPECS -->
  <div class="section">
    <div class="title">[ NODE SPECS ]</div>
    <div class="row"><span class="label">MEMORY</span><span class="fill"></span><span class="value">64GB</span></div>
    <div class="row"><span class="label">STORAGE</span><span class="fill"></span><span class="value">4TB NVMe</span></div>
  </div>

  <!-- PUBKEY -->
  <div class="section">
    <div class="title">[ PUBKEY ]</div>
    <div class="pubkey" id="pubkey"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <a id="amboss" target="_blank">AMBOSS</a>
    /
    <a id="mempool" target="_blank">MEMPOOL</a>
  </div>

</div>

<script>
const PUBKEY = '033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28';

document.getElementById("pubkey").textContent = PUBKEY;

document.getElementById("amboss").href =
  `https://amboss.space/node/${PUBKEY}`;

document.getElementById("mempool").href =
  `https://mempool.space/lightning/node/${PUBKEY}`;

/* API */
fetch(`https://mempool.space/api/v1/lightning/nodes/${PUBKEY}`)
.then(r => r.json())
.then(d => {
  const btc = (d.capacity / 100000000).toFixed(2);
  document.getElementById("capacity").textContent = btc + " BTC";
  document.getElementById("channels").textContent = d.active_channel_count;
})
.catch(()=>{});
</script>

</body>
</html>
