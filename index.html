<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS POLLOS HERMANOS LTD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --ink: #c7cecf;
      --ink-soft: rgba(199,206,207,.7);
      --ink-dim: rgba(199,206,207,.4);
      --line: rgba(199,206,207,.15);
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    body {
      background:#000;
      color:var(--ink);
      font-family:"Inter",sans-serif;
    }

    .hero {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .hero-title {
      font-family:"Jost",sans-serif;
      font-size:clamp(26px,3.8vw,54px);
      font-weight:600;
      letter-spacing:.01em;
      margin-bottom:16px;
      text-align:center;
    }

    .oval-stage {
      position:relative;
      width:min(96vw,1080px);
      aspect-ratio:1312/931;
    }

    .oval-base {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .quad {
      position:absolute;
      width:18%;
      text-align:center;
      transform:translate(-50%,-50%);
    }

    .quad-label {
      font-family:"Jost";
      font-size:12px;
      letter-spacing:.18em;
      color:var(--ink-soft);
      margin-bottom:6px;
    }

    .quad-value {
      font-family:"Jost";
      font-size:clamp(20px,2.2vw,38px);
      font-weight:600;
    }

    .quad-capacity { top:35.5%; left:38.5%; }
    .quad-channels { top:35.5%; left:61.5%; }
    .quad-rebal    { top:65.5%; left:39%; }
    .quad-ppm      { top:65.5%; left:61%; }

    .content {
      max-width:900px;
      margin:0 auto;
      padding:40px 20px 80px;
    }

    .section {
      border-top:1px solid var(--line);
      padding-top:18px;
      margin-top:28px;
    }

    .section-title {
      font-size:10px;
      letter-spacing:.35em;
      color:var(--ink-soft);
      margin-bottom:14px;
    }

    .pubkey {
      font-size:13px;
      line-height:1.6;
      word-break:break-all;
      padding:10px 0;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      cursor:pointer;
    }

    .links {
      margin-top:14px;
      font-size:11px;
      letter-spacing:.25em;
      color:var(--ink);
    }

    .links a {
      color:var(--ink);
      text-decoration:none;
    }

    .links a:hover {
      color:#fff;
    }

    .channels {
      font-size:13px;
      color:var(--ink-dim);
      padding:6px 0;
    }

    .footer {
      margin-top:40px;
      text-align:center;
      font-size:10px;
      letter-spacing:.3em;
      color:var(--ink-dim);
      border-top:1px solid var(--line);
      padding-top:16px;
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-title">LOS POLLOS HERMANOS LTD</div>

  <div class="oval-stage">
    <img src="ozark-oval.png" class="oval-base" />

    <div class="quad quad-capacity">
      <div class="quad-label">CAPACITY</div>
      <div class="quad-value" id="cap">?</div>
    </div>

    <div class="quad quad-channels">
      <div class="quad-label">CHANNELS</div>
      <div class="quad-value" id="ch">?</div>
    </div>

    <div class="quad quad-rebal">
      <div class="quad-label">REBALANCING</div>
      <div class="quad-value">AUTO</div>
    </div>

    <div class="quad quad-ppm">
      <div class="quad-label">PPM</div>
      <div class="quad-value">MANAGED</div>
    </div>
  </div>
</div>

<div class="content">

  <div class="section">
    <div class="section-title">ACCESS</div>

    <div class="section-title" style="margin-top:10px;">PUBKEY</div>
    <div class="pubkey" onclick="navigator.clipboard.writeText(this.innerText)">
      033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28
    </div>

    <div class="links">
      <a href="https://amboss.space/node/033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28" target="_blank">AMBOSS</a>
      &nbsp;/&nbsp;
      <a href="https://mempool.space/lightning/node/033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28" target="_blank">MEMPOOL</a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">CHANNEL DATA</div>
    <div class="channels">Channel data unavailable</div>
  </div>

  <div class="footer">
    LOS POLLOS HERMANOS LTD
  </div>

</div>

</body>
</html>
