<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS POLLOS HERMANOS LTD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --ink: #c7cecf;
      --ink-soft: rgba(199,206,207,.76);
      --ink-dim: rgba(199,206,207,.42);
      --line: rgba(199,206,207,.12);
      --white: #f2f4f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: min(100%, 1080px);
      padding: 10px 18px 18px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2px;
    }

    .hero-title {
      font-family: "Jost", sans-serif;
      font-size: clamp(30px, 3.3vw, 54px);
      font-weight: 600;
      letter-spacing: .03em;
      line-height: 1;
      color: var(--white);
      text-align: center;
      margin-bottom: 6px;
    }

    .hero-sub {
      font-size: 8px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--ink-dim);
      opacity: .58;
      text-align: center;
      margin-bottom: 10px;
    }

    .oval-stage {
      position: relative;
      width: min(56vw, 520px);
      aspect-ratio: 1312 / 931;
      margin-bottom: 6px;
    }

    .oval-base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .quad {
      position: absolute;
      width: 19%;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .quad-label {
      font-family: "Jost", sans-serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .quad-value {
      font-family: "Jost", sans-serif;
      font-weight: 600;
      line-height: 1;
      color: var(--white);
      white-space: nowrap;
    }

    .quad-capacity { top: 36.1%; left: 37.4%; }
    .quad-channels { top: 36.1%; left: 62.6%; }
    .quad-rebal    { top: 65.2%; left: 37.4%; }
    .quad-fees     { top: 65.2%; left: 62.6%; }

    #cap {
      font-size: clamp(15px, 1.55vw, 24px);
      letter-spacing: 0;
    }

    #ch {
      font-size: clamp(15px, 1.45vw, 22px);
      letter-spacing: 0;
    }

    .quad-rebal .quad-value {
      font-size: clamp(16px, 1.55vw, 24px);
      letter-spacing: .01em;
    }

    .quad-fees .quad-value {
      font-size: clamp(14px, 1.3vw, 20px);
      letter-spacing: .005em;
    }

    .content {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 12px;
    }

    .section-title {
      font-family: "Jost", sans-serif;
      font-size: 8px;
      letter-spacing: .30em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .pubkey {
      font-size: 12px;
      line-height: 1.6;
      word-break: break-all;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      color: var(--white);
    }

    .pubkey:hover {
      color: #fff;
    }

    .meta-line {
      font-size: 12px;
      line-height: 1.55;
      color: var(--ink-dim);
      padding: 2px 0;
    }

    .links {
      margin-top: 10px;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .links a {
      color: var(--white);
      text-decoration: none;
    }

    .links a:hover {
      color: #fff;
    }

    .debug {
      margin-top: 6px;
      font-size: 9px;
      color: rgba(199,206,207,.28);
      line-height: 1.35;
      word-break: break-word;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 8px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--ink-dim);
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    @media (max-width: 900px) {
      .oval-stage {
        width: min(66vw, 500px);
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 10px 14px 16px;
      }

      .hero-title {
        font-size: clamp(24px, 8vw, 36px);
      }

      .hero-sub {
        font-size: 7px;
        letter-spacing: .14em;
        margin-bottom: 8px;
      }

      .oval-stage {
        width: min(88vw, 520px);
      }

      .quad {
        width: 22%;
      }

      .quad-label {
        font-size: 7px;
        margin-bottom: 4px;
      }

      #cap,
      #ch,
      .quad-rebal .quad-value,
      .quad-fees .quad-value {
        font-size: clamp(12px, 3.7vw, 18px);
      }

      .content {
        max-width: 100%;
      }

      .pubkey,
      .meta-line {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-title">LOS POLLOS HERMANOS LTD</div>
      <div class="hero-sub">Where something delicious is always routing</div>

      <div class="oval-stage">
        <img src="ozark-oval.png" class="oval-base" alt="Ozark-inspired oval mark" />

        <div class="quad quad-capacity">
          <div class="quad-label">Capacity</div>
          <div class="quad-value" id="cap">...</div>
        </div>

        <div class="quad quad-channels">
          <div class="quad-label">Channels</div>
          <div class="quad-value" id="ch">...</div>
        </div>

        <div class="quad quad-rebal">
          <div class="quad-label">Rebalancing</div>
          <div class="quad-value">AUTO</div>
        </div>

        <div class="quad quad-fees">
          <div class="quad-label">Fees</div>
          <div class="quad-value">ACTIVE</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-title">Node</div>

        <div class="section-title" style="margin-top:8px;">Public Key</div>
        <div class="pubkey" id="pubkeyText" onclick="navigator.clipboard.writeText(this.innerText)">
          loading...
        </div>

        <div class="links">
          <a id="ambossLink" href="#" target="_blank" rel="noopener noreferrer">Amboss</a>
          &nbsp;/&nbsp;
          <a id="mempoolLink" href="#" target="_blank" rel="noopener noreferrer">Mempool</a>
        </div>

        <div class="debug" id="debugLine"></div>
      </div>

      <div class="section">
        <div class="section-title">Hardware</div>
        <div class="meta-line">4TB NVMe · 64GB RAM</div>
      </div>

      <div class="footer">
        LOS POLLOS HERMANOS LTD
      </div>
    </div>
  </div>

  <script>
    const PUBKEY = '033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28';
    const API_URL = `https://mempool.space/api/v1/lightning/nodes/${PUBKEY}`;
    const AMBOSS_URL = `https://amboss.space/node/${PUBKEY}`;
    const MEMPOOL_URL = `https://mempool.space/lightning/node/${PUBKEY}`;

    const elCap = document.getElementById('cap');
    const elCh = document.getElementById('ch');
    const elPub = document.getElementById('pubkeyText');
    const elAmboss = document.getElementById('ambossLink');
    const elMempool = document.getElementById('mempoolLink');
    const elDebug = document.getElementById('debugLine');

    elPub.textContent = PUBKEY;
    elAmboss.href = AMBOSS_URL;
    elMempool.href = MEMPOOL_URL;

    function toNumber(v) {
      if (typeof v === 'number' && Number.isFinite(v)) return v;
      if (typeof v === 'string') {
        const n = Number(v.replace(/,/g, '').trim());
        return Number.isFinite(n) ? n : null;
      }
      return null;
    }

    function formatBtcFromSats(v) {
      const n = toNumber(v);
      if (n === null) return '-- BTC';
      return `${(n / 100000000).toFixed(2)} BTC`;
    }

    function formatInt(v) {
      const n = toNumber(v);
      if (n === null) return '--';
      return new Intl.NumberFormat('en-US').format(n);
    }

    function findChannelValue(data) {
      const candidates = [
        data.channels,
        data.num_channels,
        data.channel_count,
        data.open_channel_count,
        data.active_channel_count,
        data.channelcount,
        data.numChannels,
        data.statistics?.channel_count,
        data.statistics?.channels,
        data.statistics?.active_channel_count,
        data.node?.channels,
        data.node?.channel_count,
        Array.isArray(data.active_channel_ids) ? data.active_channel_ids.length : null,
        Array.isArray(data.channels) ? data.channels.length : null
      ];

      for (const value of candidates) {
        const n = toNumber(value);
        if (n !== null) return n;
      }

      return null;
    }

    async function loadNode() {
      try {
        const res = await fetch(API_URL, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        console.log('mempool node payload:', data);

        const capacityValue =
          data.capacity ??
          data.total_capacity ??
          data.capacity_sat ??
          data.node_capacity ??
          null;

        const channelsValue = findChannelValue(data);

        elCap.textContent = formatBtcFromSats(capacityValue);
        elCh.textContent = formatInt(channelsValue);

        elDebug.textContent =
          `${data.alias || 'Node'} · capacity raw: ${String(capacityValue)} · channels raw: ${String(channelsValue)} · keys: ${Object.keys(data).join(', ')}`;
      } catch (err) {
        console.error(err);
        elCap.textContent = '-- BTC';
        elCh.textContent = '--';
        elDebug.textContent = `live fetch failed · ${err.message}`;
      }
    }

    loadNode();
  </script>
</body>
</html>
