<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOS POLLOS HERMANOS LTD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --ink: #c7cecf;
      --ink-soft: rgba(199,206,207,.78);
      --ink-dim: rgba(199,206,207,.45);
      --line: rgba(199,206,207,.16);
      --white: #f2f4f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 40px;
    }

    .hero-title {
      font-family: "Jost", sans-serif;
      font-size: clamp(30px, 3.8vw, 58px);
      font-weight: 600;
      letter-spacing: .035em;
      text-align: center;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--white);
    }

    .hero-sub {
      font-family: "Inter", sans-serif;
      font-size: 11px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--ink-dim);
      text-align: center;
      margin-bottom: 18px;
      opacity: .72;
    }

    .oval-stage {
      position: relative;
      width: min(96vw, 1080px);
      aspect-ratio: 1312 / 931;
    }

    .oval-base {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .quad {
      position: absolute;
      width: 18%;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .quad-label {
      font-family: "Jost", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .quad-value {
      font-family: "Jost", sans-serif;
      font-size: clamp(22px, 2.35vw, 42px);
      font-weight: 600;
      letter-spacing: .015em;
      line-height: 1;
      color: var(--white);
      white-space: nowrap;
    }

    .quad-capacity { top: 36%; left: 37%; }
    .quad-channels { top: 36%; left: 63%; }
    .quad-rebal    { top: 66%; left: 37%; }
    .quad-fees     { top: 66%; left: 63%; }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 20px 80px;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 28px;
    }

    .section-title {
      font-family: "Jost", sans-serif;
      font-size: 10px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    .pubkey {
      font-size: 13px;
      line-height: 1.75;
      word-break: break-all;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      color: var(--white);
    }

    .pubkey:hover {
      color: #fff;
    }

    .meta-line {
      font-size: 13px;
      line-height: 1.8;
      color: var(--ink-dim);
      padding: 4px 0;
    }

    .links {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .links a {
      color: var(--white);
      text-decoration: none;
    }

    .links a:hover {
      color: #fff;
    }

    .status-ok {
      color: var(--ink-dim);
    }

    .status-bad {
      color: #9aa3a5;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--ink-dim);
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    @media (max-width: 820px) {
      .hero-sub {
        font-size: 10px;
        letter-spacing: .18em;
        margin-bottom: 18px;
      }

      .quad {
        width: 24%;
      }

      .quad-label {
        font-size: 10px;
      }

      .quad-value {
        font-size: clamp(18px, 3.8vw, 28px);
      }
    }

    @media (max-width: 560px) {
      .hero-title {
        line-height: 1.08;
      }

      .hero-sub {
        max-width: 90%;
        line-height: 1.7;
      }

      .quad {
        width: 28%;
      }

      .quad-label {
        font-size: 9px;
        margin-bottom: 6px;
      }

      .quad-value {
        font-size: clamp(16px, 4vw, 22px);
      }

      .content {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-title">LOS POLLOS HERMANOS LTD</div>
    <div class="hero-sub">Where something delicious is always routing</div>

    <div class="oval-stage">
      <img src="ozark-oval.png" class="oval-base" alt="Ozark-inspired oval mark" />

      <div class="quad quad-capacity">
        <div class="quad-label">Capacity</div>
        <div class="quad-value" id="cap">LOADING</div>
      </div>

      <div class="quad quad-channels">
        <div class="quad-label">Channels</div>
        <div class="quad-value" id="ch">LOADING</div>
      </div>

      <div class="quad quad-rebal">
        <div class="quad-label">Rebalancing</div>
        <div class="quad-value">AUTO</div>
      </div>

      <div class="quad quad-fees">
        <div class="quad-label">Fees</div>
        <div class="quad-value">DYNAMIC</div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="section">
      <div class="section-title">Node</div>

      <div class="section-title" style="margin-top:10px;">Public Key</div>
      <div class="pubkey" id="pubkeyText" onclick="navigator.clipboard.writeText(this.innerText)">
        loading...
      </div>

      <div class="links">
        <a id="ambossLink" href="#" target="_blank" rel="noopener noreferrer">Amboss</a>
        &nbsp;/&nbsp;
        <a id="mempoolLink" href="#" target="_blank" rel="noopener noreferrer">Mempool</a>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Hardware</div>
      <div class="meta-line">4TB NVMe · 64GB RAM</div>
    </div>

    <div class="section">
      <div class="section-title">Routing</div>
      <div class="meta-line status-ok" id="routingStatus">Fetching live node data...</div>
    </div>

    <div class="footer">
      LOS POLLOS HERMANOS LTD
    </div>

  </div>

  <script>
    const PUBKEY = '033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28';
    const MEMPOOL_NODE_API = `https://mempool.space/api/v1/lightning/nodes/${PUBKEY}`;
    const MEMPOOL_NODE_URL = `https://mempool.space/lightning/node/${PUBKEY}`;
    const AMBOSS_NODE_URL = `https://amboss.space/node/${PUBKEY}`;

    const elCap = document.getElementById('cap');
    const elCh = document.getElementById('ch');
    const elPub = document.getElementById('pubkeyText');
    const elRouting = document.getElementById('routingStatus');
    const elAmboss = document.getElementById('ambossLink');
    const elMempool = document.getElementById('mempoolLink');

    elPub.textContent = PUBKEY;
    elAmboss.href = AMBOSS_NODE_URL;
    elMempool.href = MEMPOOL_NODE_URL;

    function satsToBtc(sats) {
      if (typeof sats !== 'number' || Number.isNaN(sats)) return '-- BTC';
      return `${(sats / 100000000).toFixed(2)} BTC`;
    }

    function formatChannels(n) {
      if (typeof n !== 'number' || Number.isNaN(n)) return '--';
      return new Intl.NumberFormat('en-US').format(n);
    }

    async function loadNodeStats() {
      try {
        const res = await fetch(MEMPOOL_NODE_API, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        elCap.textContent = satsToBtc(data.capacity);
        elCh.textContent = formatChannels(data.channels);

        const alias = data.alias ? `${data.alias} · ` : '';
        elRouting.textContent = `${alias}Live data loaded from mempool.space`;
        elRouting.classList.remove('status-bad');
        elRouting.classList.add('status-ok');
      } catch (err) {
        console.error('Failed to load node stats:', err);
        elCap.textContent = '-- BTC';
        elCh.textContent = '--';
        elRouting.textContent = 'Live node data unavailable';
        elRouting.classList.remove('status-ok');
        elRouting.classList.add('status-bad');
      }
    }

    loadNodeStats();
  </script>

</body>
</html>
