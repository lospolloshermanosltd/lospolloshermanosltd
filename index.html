<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOS POLLOS HERMANOS LTD | NODE OPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ranchers&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'JI Burrito';
  src: url('JI Burrito.ttf') format('truetype');
  font-display: swap;
}

:root {
  --bg: #050505;
  --panel-bg: #0a0a0a;
  --fg: #d9e3e1;
  --fg-soft: #e6e6e6;
  --fg-dim: rgba(230,230,230,0.52);
  --line: #1F4E79;
  --line-faint: rgba(31,78,121,0.18);
  --accent: #F3D80D;
  --accent-glow: rgba(243,216,13,0.34);
  --brand-red: #DA291C;
  --brand-red-glow: rgba(218,41,28,0.34);

  --page-max: 1100px;

  --title-size: 80px; /* 고정 */
  --sub-size: 11px;
  --routing-size: 18px;
  --section-title-size: 15px;
  --row-size: 13px;
  --pubkey-size: 11px;
}

* { box-sizing: border-box; cursor: crosshair; }

html, body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:'JetBrains Mono', monospace;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100svh;
  padding: 2vh 16px 2vh; /* ↓ 압축 */
}

.page {
  width:min(100%, var(--page-max));
  display:grid;
  grid-template-rows:auto auto 1fr auto auto;
  row-gap:20px; /* ↓ 기존보다 타이트 */
}

.brand { text-align:center; }
.brand-title {
  font-family:'JI Burrito','Ranchers';
  font-size:var(--title-size);
  line-height:0.92;
  letter-spacing:-1.35px;
  color:var(--accent);
  text-shadow:2px 2px 0 rgba(0,0,0,0.95),0 0 8px var(--accent-glow);
}
.brand-sub {
  font-size:var(--sub-size);
  letter-spacing:0.34em;
  color:var(--fg-dim);
}

.routing-title {
  text-align:center;
  color:var(--accent);
  font-size:var(--routing-size);
  font-weight:800;
  letter-spacing:0.18em;
}

.menu-container {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px; /* ↓ 살짝 압축 */
}

.menu-track {
  background:var(--panel-bg);
  border:2px solid var(--line);
  padding:22px 24px; /* ↓ 압축 */
  display:grid;
  row-gap:28px;
}

.section-title {
  display:flex;
  justify-content:space-between;
  border-bottom:1px dotted var(--line);
  padding-bottom:5px;
  font-size:var(--section-title-size);
  color:#fff;
}

.row {
  display:grid;
  grid-template-columns:auto 1fr auto;
  font-size:var(--row-size);
}

.label { color:var(--fg-soft); }
.fill { border-bottom:1px dotted var(--line-faint); margin:0 8px 3px 0; }
.value { color:var(--accent); font-weight:700; }

.secure-channel {
  text-align:center;
  border-top:1px dashed var(--line);
  padding-top:14px;
}

.pubkey {
  margin-top:8px;
  font-size:var(--pubkey-size);
  color:var(--fg-dim);
  padding:8px 14px;
  border:1px solid var(--line);
}

.footer {
  display:flex;
  justify-content:center;
  gap:12px;
}
.footer a {
  min-width:120px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--brand-red);
  color:#fff;
  font-weight:900;
  font-size:13px;
}

/* 🔥 핵심: 모바일에서도 절대 줄이지 않음 */
@media (max-width: 920px) {
  .menu-container { grid-template-columns:1fr; gap:20px; }
  .brand-title { font-size:80px; } /* 유지 */
}
</style>
</head>

<body>
<main class="page">

<header class="brand">
  <h1 class="brand-title">LOS POLLOS HERMANOS LTD</h1>
  <p class="brand-sub">IF THE ROUTE MATTERS, THE KITCHEN IS OPEN.</p>
</header>

<div class="routing-title">ROUTING MENU_</div>

<section class="menu-container">

<div class="menu-track">
  <div class="section-title"><span>[ TODAY'S INGREDIENTS ]</span><span>SIZE</span></div>
  <div class="row"><span class="label">DEEP FRYER CAPACITY</span><span class="fill"></span><span class="value">--</span></div>
  <div class="row"><span class="label">ACTIVE FRANCHISES</span><span class="fill"></span><span class="value">--</span></div>
</div>

<div class="menu-track">
  <div class="section-title"><span>[ ROUTING SPICE LEVELS ]</span><span>FEE</span></div>
  <div class="row"><span class="label">BALANCED</span><span class="fill"></span><span class="value">CLASSIC</span></div>
</div>

</section>

<section class="secure-channel">
  <div class="pubkey">033667040797f8f7ab18e864ead4f091a773a6c048d8f3f74a550236034f120f28</div>
</section>

<footer class="footer">
  <a href="#">AMBOSS</a>
  <a href="#">MEMPOOL</a>
</footer>

</main>
</body>
</html>
